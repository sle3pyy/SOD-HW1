[project]
name = "sod-hw1-partb"
version = "0.1.0"
description = "Part B: tagging the main entrances of public buildings from OSM (Hu et al., 2021)"
requires-python = ">=3.14"
dependencies = [
    "sod-common",
    "imbalanced-learn>=0.13",
    "matplotlib",
    "numpy",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "statsmodels",
    "pyrosm>=0.23",
    "geopandas>=1.2.0",
    "sqlalchemy>=2.1.4",
    "psycopg[binary]>=3.3.6",
    "geoalchemy2>=0.20.0",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[tool.uv.sources]
sod-common = { workspace = true }
