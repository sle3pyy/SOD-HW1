services:
  postgis:
    image: postgis/postgis:latest
    container_name: sod-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis}
    ports:
      - "${POSTGIS_PORT:-5432}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./generated-data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geostack

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sod-pgadmin
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - geostack

  geoserver:
    image: geosolutionsit/geoserver:latest
    container_name: sod-geoserver
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      ROOT_WEBAPP_REDIRECT: "true"
      SKIP_DEMO_DATA: ${GEOSERVER_SKIP_DEMO_DATA:-true}
      POSTGRES_JNDI_ENABLED: "true"
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-gis}
      POSTGRES_USERNAME: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis}
      POSTGRES_JNDI_RESOURCE_NAME: jdbc/postgis
      EXTRA_JAVA_OPTS: ${GEOSERVER_JAVA_OPTS:--Xms512m -Xmx1g}
    ports:
      - "${GEOSERVER_PORT:-8080}:8080"
    volumes:
      - geoserver-data:/opt/geoserver_data
    networks:
      - geostack

networks:
  geostack:
    name: sod-geostack

volumes:
  postgis-data:
  pgadmin-data:
  geoserver-data:
