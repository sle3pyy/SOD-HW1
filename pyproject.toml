[project]
name = "sod-hw1"
version = "0.1.0"
description = "SOD Homework 1: spatial data analysis (Part A map matching, Part B entrance detection)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sod-common",
    "sod-hw1-parta",
    "sod-hw1-partb",
]

[tool.uv]
package = false
exclude-newer = "14 days"
# pyrosm 0.15.0 is ~10x slower on our PBF, so pyrosm alone is exempt (decided 2026-10-21).
exclude-newer-package = { pyrosm = false }

[tool.uv.workspace]
members = ["common", "part_a", "part_b"]

[tool.uv.sources]
sod-common = { workspace = true }
sod-hw1-parta = { workspace = true }
sod-hw1-partb = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["part_b/src"]
